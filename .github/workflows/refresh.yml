name: refresh market data

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry2.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch market data
        run: python fetch_data.py
      - name: Build share cards
        continue-on-error: true
        run: |
          python -m pip install --quiet pillow || true
          python make_og.py || true
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css data.json methods.md README.md LICENSE _site/
          cp flow.html swarm.html insight.html _site/
          cp -r assets fonts _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Wait before second retry
        if: steps.deployment.outcome == 'failure' || steps.deployment_retry.outcome == 'failure'
        run: sleep 120
      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' || steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
