name: refresh market data

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch market data
        run: python fetch_data.py
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css data.json methods.md README.md LICENSE _site/
          cp -r assets fonts _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep the repository snapshot fresh
        continue-on-error: true
        run: |
          git config user.name 'taskmarket-live-visualizer'
          git config user.email 'viz@users.noreply.github.com'
          git add data.json
          git diff --staged --quiet || git commit -m 'chore: refresh market data'
          git push || true